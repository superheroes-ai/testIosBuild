workflows:
  monogame-ios-unsigned:
    name: MonoGame iOS (unsigned test build)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 16.4          # must match what the iOS workload for your .NET 9 version expects
      vars:
        PROJECT: testIosBuild.csproj   # <-- change to your csproj path
    scripts:
      - name: Check .NET
        script: |
          dotnet --info
      - name: Install iOS workload
        script: |
          dotnet workload install ios
      - name: Restore
        script: |
          dotnet restore "$PROJECT"
      - name: Build (no signing)
        script: |
          dotnet build "$PROJECT" -c Release -f net9.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false