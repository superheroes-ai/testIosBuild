workflows:
  monogame-ios-simulator-build:
    name: MonoGame iOS Simulator
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 16.4
      vars:
        DOTNET_ROOT: $CM_BUILD_DIR/dotnet
        DOTNET: $CM_BUILD_DIR/dotnet/dotnet
        PROJECT_FILE: testIosBuild.csproj   # <-- your csproj name
    scripts:
      - name: Install .NET 9 SDK
        script: |
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 9.0 --install-dir $DOTNET_ROOT
          $DOTNET --info
      - name: Install iOS workload
        script: |
          $DOTNET nuget locals all --clear
          $DOTNET workload install ios
      - name: Restore
        script: |
          $DOTNET restore $PROJECT_FILE
      - name: Build for iOS Simulator
        script: |
          $DOTNET build $PROJECT_FILE -f net9.0-ios -c Debug \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -o artifacts
    artifacts:
      - ./artifacts/*.app